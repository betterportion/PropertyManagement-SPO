# Runs the same four checks a developer runs locally, on every push and every
# pull request, so a change that breaks one of them is caught before review
# rather than after merge.
#
# Nothing here needs a secret. The tests replace the database and the file
# store with stand-ins, so this workflow never touches real data, a real
# bucket, or the identity provider -- which also means it runs safely on a
# pull request opened from a fork.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch cancels the run still in progress; there is
# no point spending minutes on a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version the app runs on. When that moves, move this
          # with it, or CI stops testing what actually ships.
          node-version: "20"
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if the lockfile and package.json disagree,
      # instead of quietly resolving something newer.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm test

      # Last, because it is the slowest and the least likely to fail on its
      # own -- the three checks above will usually have caught the problem.
      - name: Build
        run: npm run build
