# End-to-end tests: drive the real app in a headless browser against a real
# Postgres. Separate from ci.yml because it needs a database and a browser,
# which the unit/integration checks deliberately do not.
#
# No secrets: the database is a throwaway service container, login is a session
# cookie minted by global-setup (the app has no test-only login path), and the
# OIDC client is a placeholder because the browser never actually logs in.
name: E2E

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: e2e-session-secret-at-least-32-characters-long
      # The browser authenticates by cookie, so these only need to let OIDC
      # discovery succeed at boot; no real login happens.
      OIDC_ISSUER_URL: https://accounts.google.com
      OIDC_CLIENT_ID: e2e-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Migrate the database
        run: npm run db:migrate

      - name: Seed demo data
        run: npm run db:seed

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
